<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historias en Cómic</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; text-align: center; }
        h1 { font-family: 'Bangers', cursive; color: #0088cc; font-size: 3rem; letter-spacing: 2px; }
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 900px; margin: 0 auto; }
        .card { background: white; border: 4px solid #000; border-radius: 12px; box-shadow: 8px 8px 0px #000; padding: 15px; width: 320px; box-sizing: border-box; }
        .card h2 { font-family: 'Bangers', cursive; font-size: 1.8rem; margin: 10px 0 5px; }
        svg { border: 3px solid #000; border-radius: 8px; background: #fff; width: 100%; height: auto; }
        footer { margin-top: 40px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Historical Stories</h1>
    <div class="grid">
        <div class="card">
            <h2>Story 1</h2>
            <svg viewBox="0 0 300 200">
                <rect width="300" height="200" fill="#ffeaa7"/>
                <circle cx="150" cy="130" r="40" fill="#ff7675"/>
                <circle cx="150" cy="80" r="25" fill="#fdcb6e"/>
                <path d="M 170 60 Q 230 30 220 70 Q 210 90 175 75 Z" fill="white" stroke="black" stroke-width="2"/>
                <text x="182" y="62" font-family="sans-serif" font-size="10" font-weight="bold" fill="black">¡Aider en</text>
                <text x="182" y="74" font-family="sans-serif" font-size="10" font-weight="bold" fill="black">acción!</text>
            </svg>
            <p>Descripción de la Historia 1</p>
        </div>
        <div class="card">
            <h2>Story 2</h2>
            <svg viewBox="0 0 300 200">
                <rect width="300" height="200" fill="#74b9ff"/>
                <polygon points="150,40 180,140 120,140" fill="#a29bfe" stroke="black" stroke-width="2"/>
                <path d="M 130 50 Q 70 20 80 60 Q 90 80 125 65 Z" fill="white" stroke="black" stroke-width="2"/>
                <text x="82" y="52" font-family="sans-serif" font-size="10" font-weight="bold" fill="black">¡Código SVG</text>
                <text x="82" y="64" font-family="sans-serif" font-size="10" font-weight="bold" fill="black">generado!</text>
            </svg>
            <p>Descripción de la Historia 2</p>
        </div>
    </div>
    <footer>Desarrollado desde Termux por <a href="https://github.com/solochegui">Solochegui</a></footer>
</body>
</html>
