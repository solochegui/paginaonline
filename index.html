<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoriBot Radio 24/7 Live</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.4rem;
            color: #38bdf8;
            margin: 0 0 5px 0;
        }

        .status-badge {
            background-color: #22c55e;
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 12px;
            display: inline-block;
        }

        /* Contenedor compacto para el texto del influencer */
        #live-feed {
            width: 100%;
            max-width: 650px;
            height: 420px;
            overflow-y: auto;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .broadcast-box {
            background: #0f172a;
            border-left: 3px solid #38bdf8;
            padding: 8px 12px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .broadcast-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        /* Letras más pequeñas y compactas */
        .broadcast-text {
            font-size: 0.82rem;
            line-height: 1.25;
            color: #cbd5e1;
            margin: 0 0 8px 0;
            white-space: pre-line;
        }

        .promo-button {
            display: inline-block;
            font-size: 0.72rem;
            color: #38bdf8;
            text-decoration: none;
            border: 1px solid #38bdf8;
            padding: 3px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .promo-button:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        /* Overlay de activación para reproducir voz automáticamente */
        #audio-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #start-btn {
            background: #38bdf8;
            color: #0f172a;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <div id="audio-overlay">
        <button id="start-btn" onclick="iniciarRadio()">🎙️ Encender Radio BoriBot</button>
    </div>

    <header>
        <h1>📻 BoriBot Radio 24/7</h1>
        <span class="status-badge">● TRANSMITIENDO EN VIVO</span>
    </header>

    <div id="live-feed"></div>

<script>
    const synth = window.speechSynthesis;
    let ultimoTextoLeido = "";
    let totalItems = 0;
    let radioActiva = false;

    function iniciarRadio() {
        radioActiva = true;
        document.getElementById('audio-overlay').style.display = 'none';
        
        // Disparo de prueba silencioso para desbloquear el motor TTS del navegador
        const testUtterance = new SpeechSynthesisUtterance('');
        synth.speak(testUtterance);
        
        actualizarPodcastLive();
    }

    function hablar(texto) {
        if (!radioActiva || !'speechSynthesis' in window) return;

        synth.cancel(); // Detener lecturas previas pendientes

        // Limpiar sintaxis markdown antes de leer para una voz natural
        const textoLimpio = texto.replace(/[*#_\-]/g, '');

        const utterance = new SpeechSynthesisUtterance(textoLimpio);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        let voces = synth.getVoices();
        let vozEspanol = voces.find(v => v.lang.startsWith('es'));
        if (vozEspanol) utterance.voice = vozEspanol;

        synth.speak(utterance);
    }

    async function actualizarPodcastLive() {
        try {
            const response = await fetch('/api/podcast-live');
            const data = await response.json();

            const feedContainer = document.getElementById('live-feed');

            if (data.length > 0 && data.length !== totalItems) {
                feedContainer.innerHTML = '';

                data.forEach(item => {
                    const block = document.createElement('div');
                    block.className = 'broadcast-box';
                    block.innerHTML = `
                        <div class="broadcast-meta">
                            <strong>🤖 BoriBot Host</strong>
                            <span>${item.time}</span>
                        </div>
                        <p class="broadcast-text">${item.text}</p>
                        <a href="${item.link}" target="_blank" class="promo-button">
                            🚀 Ir al enlace de la transmisión
                        </a>
                    `;
                    feedContainer.appendChild(block);
                });

                feedContainer.scrollTop = feedContainer.scrollHeight;
                totalItems = data.length;

                const nuevoMensaje = data[data.length - 1].text;
                if (nuevoMensaje !== ultimoTextoLeido) {
                    ultimoTextoLeido = nuevoMensaje;
                    hablar(nuevoMensaje);
                }
            }
        } catch (error) {
            console.error('Error conectando con la transmisión:', error);
        }
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => { synth.getVoices(); };
    }

    setInterval(actualizarPodcastLive, 4000);
</script>
</body>
</html>
