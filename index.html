<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoriBot Podcast Live 24/7</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .podcast-stream-card {
            background-color: #0b0c10;
            border: 2px solid #66fcf1;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.15);
        }
        .stream-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2833;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .stream-title {
            font-family: 'Orbitron', sans-serif;
            color: #66fcf1;
            margin: 0;
            font-size: 1.1rem;
        }
        .status-badge {
            background-color: #ef4444;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
        }
        .feed-container {
            height: 420px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 5px;
        }
        .loading-text {
            text-align: center;
            color: #666;
            margin-top: 50px;
        }
        .broadcast-box {
            background-color: #1f2833;
            border-left: 4px solid #eab308;
            border-radius: 6px;
            padding: 14px;
        }
        .broadcast-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #66fcf1;
            margin-bottom: 8px;
        }
        .broadcast-text {
            margin: 0 0 12px 0;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .promo-button {
            display: inline-block;
            background-color: #eab308;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            transition: 0.2s ease;
        }
        .promo-button:hover {
            background-color: #66fcf1;
            box-shadow: 0 0 8px #66fcf1;
        }
    </style>
</head>
<body>

<div class="podcast-stream-card">
    <div class="stream-header">
        <h3 class="stream-title">🎙️ BORIBOT PODCAST LIVE 24/7</h3>
        <span class="status-badge">🔴 TRANSMITIENDO CON QWEN</span>
    </div>

    <div id="live-feed" class="feed-container">
        <p class="loading-text">Conectando a la emisión en tiempo real...</p>
    </div>
</div>

<script>
    let totalItems = 0;

    async function actualizarPodcastLive() {
        try {
            const response = await fetch('http://localhost:5000/api/podcast-live');
            const data = await response.json();
            
            const feedContainer = document.getElementById('live-feed');
            
            if (data.length > 0 && data.length !== totalItems) {
                feedContainer.innerHTML = '';
                
                data.forEach(item => {
                    const block = document.createElement('div');
                    block.className = 'broadcast-box';
                    block.innerHTML = `
                        <div class="broadcast-meta">
                            <strong>🤖 BoriBot (Qwen AI Host)</strong>
                            <span>${item.time}</span>
                        </div>
                        <p class="broadcast-text">${item.text}</p>
                        <a href="${item.link}" target="_blank" class="promo-button">
                            🚀 Ver Algoritmo BoriSystem en Gumroad
                        </a>
                    `;
                    feedContainer.appendChild(block);
                });
                
                feedContainer.scrollTop = feedContainer.scrollHeight;
                totalItems = data.length;
            }
        } catch (error) {
            console.error('Error conectando con la transmisión:', error);
        }
    }

    setInterval(actualizarPodcastLive, 4000);
    actualizarPodcastLive();
</script>

</body>
</html>
