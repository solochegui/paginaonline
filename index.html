<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Stories</title>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --card-bg: #fff;
            --accent-color: #38bdf8;
            --text-color: #2c3e50;
            --muted-text: #94a3b8;
            --code-bg: #090d16;
            --green-accent: #4ade80;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 15px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .gallery-section {
            padding: 20px;
            border-top: 1px solid #334155;
        }

        .gallery-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            background-color: var(--card-bg);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .gallery-item img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .gallery-item h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .gallery-item p {
            color: var(--muted-text);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Historical Stories</h1>
    </header>

    <div class="gallery-section">
        <h2>Song List</h2>
        <ul class="song-list">
            <li class="song-item">
                <div class="gallery-item">
                    <img src="path/to/image1.jpg" alt="Story 1">
                    <div class="gallery-item-content">
                        <h2>Story 1</h2>
                        <p>Description of Story 1</p>
                    </div>
                </div>
            </li>
            <li class="song-item">
                <div class="gallery-item">
                    <img src="path/to/image2.jpg" alt="Story 2">
                    <div class="gallery-item-content">
                        <h2>Story 2</h2>
                        <p>Description of Story 2</p>
                    </div>
                </div>
            </li>
            <!-- Add more gallery items as needed -->
        </ul>
    </div>

    <footer>
        <p>Desarrollado desde Termux por <a href="https://github.com/solochegui" target="_blank">Solochegui</a></p>
    </footer>
</div>

</body>
</html>
