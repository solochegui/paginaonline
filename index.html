<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Page</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --code-bg: #090d16;
            --green-accent: #4ade80;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 15px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .music-section {
            padding: 20px;
            border-top: 1px solid #334155;
        }

        .song-list {
            list-style-type: none;
            padding: 0;
        }

        .song-item {
            margin-bottom: 10px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
        }

        .song-title {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .song-artist {
            color: var(--muted-text);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Music Page</h1>
    </header>

    <div class="music-section">
        <h2>Song List</h2>
        <ul class="song-list">
            <li class="song-item">
                <div class="song-title">Song 1</div>
                <div class="song-artist">Artist 1</div>
            </li>
            <li class="song-item">
                <div class="song-title">Song 2</div>
                <div class="song-artist">Artist 2</div>
            </li>
            <!-- Add more song items as needed -->
        </ul>
    </div>

    <footer>
        <p>Desarrollado desde Termux por <a href="https://github.com/solochegui" target="_blank">Solochegui</a></p>
    </footer>
</div>

</body>
</html>
